services:
  postgres:
    image: postgres:16
    container_name: catalogo-postgres
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: ${DB_USERNAME:-catalogo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-catalogo}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-catalogo} -d catalogo"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: catalogo-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/catalogo
      DB_USERNAME: ${DB_USERNAME:-catalogo}
      DB_PASSWORD: ${DB_PASSWORD:-catalogo}
      JWT_SECRETO: ${JWT_SECRETO}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:4200}
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data: